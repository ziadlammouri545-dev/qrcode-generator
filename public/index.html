<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>qr generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      :root {
        --paper: #f2f3f5;
        --card: #ffffff;
        --ink: #17181c;
        --muted: #6b7078;
        --line: #dfe1e5;
        --teal: #0f9d8f;
        --apricot: #fb923c;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 32px 16px;
        background: var(--paper);
        color: var(--ink);
        font-family: "Inter", -apple-system, "Segoe UI", sans-serif;
        font-size: 14px;
      }
      .wrap {
        width: 100%;
        max-width: 420px;
      }
      .top {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 6px;
      }
      .top .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--teal);
        align-self: center;
      }
      .top h1 {
        margin: 0;
        font-family: "Bricolage Grotesque", sans-serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p.sub {
        margin: 0 0 28px;
        color: var(--muted);
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-bottom: 8px;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        font-size: 15px;
        font-family: inherit;
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      input::placeholder { color: #a6abb3; }
      input:focus {
        outline: none;
        border-color: var(--teal);
        box-shadow: 0 0 0 3px rgba(15, 157, 143, 0.15);
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 18px;
      }
      .row .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
      .swatches {
        display: flex;
        gap: 8px;
      }
      .swatch {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        padding: 0;
      }
      .swatch[data-color="#17181c"] { background: var(--ink); }
      .swatch[data-color="#0f9d8f"] { background: var(--teal); }
      .swatch[data-color="#fb923c"] { background: var(--apricot); }
      .swatch.sel { border-color: var(--card); box-shadow: 0 0 0 2px var(--ink); }
      .swatch[data-color="#0f9d8f"].sel { box-shadow: 0 0 0 2px var(--teal); }
      .swatch[data-color="#fb923c"].sel { box-shadow: 0 0 0 2px var(--apricot); }
      .stage {
        margin-top: 18px;
        min-height: 264px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        transition: background 150ms ease;
      }
      .stage img {
        display: block;
        width: 220px;
        height: 220px;
        image-rendering: pixelated;
      }
      .stage.no-qr { color: #a6abb3; }
      .bar {
        margin-top: 12px;
        min-height: 40px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
      }
      .status {
        font-size: 13px;
        color: var(--muted);
        margin-right: auto;
      }
      .status.ok { color: var(--teal); }
      button.dl {
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        background: var(--teal);
        border: none;
        border-radius: 10px;
        padding: 10px 18px;
        cursor: pointer;
        display: none;
        transition: background 120ms ease;
      }
      button.dl:hover { background: #0b7f74; }
      button.dl:active { transform: translateY(1px); }
      button.dl:focus-visible, .swatch:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="top">
        <span class="dot"></span>
        <h1>qr generator</h1>
      </div>
      <p class="sub">paste a link, get a png to share anywhere</p>

      <label for="url">Link</label>
      <input id="url" type="text" placeholder="https://..." autocomplete="off" spellcheck="false" />

      <div class="row">
        <span class="label">Color</span>
        <div class="swatches" id="swatches">
          <button class="swatch sel" data-color="#17181c" aria-label="ink" type="button" aria-pressed="true"></button>
          <button class="swatch" data-color="#0f9d8f" aria-label="teal" type="button" aria-pressed="false"></button>
          <button class="swatch" data-color="#fb923c" aria-label="apricot" type="button" aria-pressed="false"></button>
        </div>
      </div>

      <div class="stage no-qr" id="stage">the qr shows up here</div>

      <div class="bar">
        <span class="status" id="status"></span>
        <button class="dl" id="dl" type="button">download png</button>
      </div>
    </main>

    <script>
      const input = document.getElementById("url");
      const stage = document.getElementById("stage");
      const status = document.getElementById("status");
      const dl = document.getElementById("dl");
      const swatches = document.querySelectorAll(".swatch");

      let dark = "#17181c";

      swatches.forEach((s) =>
        s.addEventListener("click", () => {
          swatches.forEach((x) => {
            x.classList.remove("sel");
            x.setAttribute("aria-pressed", "false");
          });
          s.classList.add("sel");
          s.setAttribute("aria-pressed", "true");
          dark = s.dataset.color;
          render();
        })
      );

      let timer;
      input.addEventListener("input", () => {
        clearTimeout(timer);
        timer = setTimeout(render, 180);
      });

      function render() {
        const text = input.value.trim();
        if (!text) {
          stage.className = "stage no-qr";
          stage.textContent = "the qr shows up here";
          status.textContent = "";
          status.className = "status";
          dl.style.display = "none";
          return;
        }
        const q = `text=${encodeURIComponent(text)}&dark=${encodeURIComponent(dark)}&size=300`;
        stage.className = "stage";
        stage.innerHTML = `<img src="/qr?${q}" alt="qr for ${text}" />`;
        status.textContent = "ready to download";
        status.className = "status ok";
        dl.style.display = "inline-block";
      }

      dl.addEventListener("click", () => {
        const text = input.value.trim();
        if (!text) return;
        const q = `text=${encodeURIComponent(text)}&dark=${encodeURIComponent(dark)}&size=300`;
        const a = document.createElement("a");
        a.href = `/qr?${q}`;
        a.download = "qr.png";
        a.click();
      });
    </script>
  </body>
</html>
